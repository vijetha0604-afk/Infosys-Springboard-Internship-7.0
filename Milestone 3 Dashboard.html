<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--navy:#081426;--panel:#fff;--bg:#eef3f8;--ink:#102033;--muted:#66778b;--accent:#16a6a6;--blue:#2878d8;--line:#dce5ee;--danger:#d9534f}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:#fff;padding:22px 14px;position:fixed;height:100vh;z-index:20}.brand{font-size:19px;font-weight:800;padding:0 10px 24px}.brand small{display:block;font-size:11px;color:#91a4ba;margin-top:5px;font-weight:500}.nav button{width:100%;border:0;background:transparent;color:#b9c7d7;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#122944;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.title h1{margin:0;font-size:27px}.title p{margin:5px 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:hover{filter:brightness(.97)}.filters,.panel,.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px rgba(19,42,70,.05)}.filters{padding:12px;display:grid;grid-template-columns:repeat(7,minmax(120px,1fr)) auto;gap:8px;margin-bottom:16px}.filters select,.filters input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.kpi{padding:16px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:23px;font-weight:800;margin-top:8px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.panel{padding:14px;margin-bottom:14px}.panel h3{margin:0 0 8px;font-size:15px}.chart{height:330px}.wide{grid-column:1/-1}.section{display:none}.section.active{display:block}.table-wrap{overflow:auto;max-height:540px;border:1px solid var(--line);border-radius:9px}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th,.data-table td{padding:9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.data-table th{position:sticky;top:0;background:#f5f8fb;cursor:pointer}.badge{padding:3px 7px;border-radius:20px;background:#e8f6f6}.info{font-size:12px;color:var(--muted)}.mobile-menu{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#102033;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:50}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0;width:100%;padding:14px}.mobile-menu{display:block}.top{align-items:flex-start}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.wide{grid-column:auto}.chart{height:280px}}

const aliases={product:'Product_type',sku:'SKU',price:'Price',availability:'Availability',sold:'Number_of_products_sold',revenue:'Revenue_generated',stock:'Stock_levels',orderqty:'Order_quantities',shiptime:'Shipping_times',carrier:'Shipping_carriers',shipcost:'Shipping_costs',supplier:'Supplier_name',location:'Location',lead:'Lead_times',inspection:'Inspection_results',defect:'Defect_rates',mode:'Transportation_modes',route:'Routes'};

function $(x){return document.querySelector(x)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function num(v){if(v===null||v===undefined||v==='')return NaN;return Number(String(v).replace(/[^0-9.-]/g,''))}function avg(a){let x=a.map(num).filter(Number.isFinite);return x.length?x.reduce((p,c)=>p+c,0)/x.length:NaN}function sum(a){let x=a.map(num).filter(Number.isFinite);return x.reduce((p,c)=>p+c,0)}function fmt(v,d=1){return Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}):'Not available in dataset'}function money(v){return Number.isFinite(v)?'₹'+v.toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:2}):'Not available in dataset'}function unique(k){return [...new Set(filtered.map(r=>r[k]).filter(v=>v!==''&&v!=null))].sort((a,b)=>String(a).localeCompare(String(b)))}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function toggleSide(){$('#side').classList.toggle('open')}
function setupNav(){let n=$('#nav');n.innerHTML=nav.map(x=>`<button class="${x===current?'active':''}" onclick="show('${x}')">${x}</button>`).join('')}
function show(s){current=s;setupNav();render();if(innerWidth<760)$('#side').classList.remove('open')}
function renderFilters(){let defs=[['Product Type','Product_type'],['Supplier','Supplier_name'],['Location','Location'],['Shipping Carrier','Shipping_carriers'],['Transportation Mode','Transportation_modes'],['Route','Routes'],['Inspection Result','Inspection_results']];$('#filters').innerHTML=defs.map(([lab,k])=>`<select data-k="${k}"><option value="">${lab}: All</option>${unique(k).map(v=>`<option>${esc(v)}</option>`).join('')}</select>`).join('')+`<button class="btn" onclick="clearFilters()">Clear All Filters</button>`;$('#filters').querySelectorAll('select').forEach(e=>e.onchange=applyFilters)}
function applyFilters(){let sels=[...$('#filters select')];filtered=raw.filter(r=>sels.every(s=>!s.value||String(r[s.dataset.k])===s.value));render();toast(`${filtered.length.toLocaleString()} records matched`)}function clearFilters(){$('#filters select').forEach(s=>s.value='');applyFilters()}
function card(label,value,sub){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function panel(title,id,wide=false){return `<div class="panel ${wide?'wide':''}"><h3>${title}</h3><div id="${id}" class="chart"></div></div>`}
function group(k,metric,fn=avg){let m={};filtered.forEach(r=>{let g=r[k];if(g==null||g==='')return;(m[g]??=[]).push(num(r[metric]))});return Object.entries(m).map(([x,a])=>({x,y:fn(a)})).filter(o=>Number.isFinite(o.y)).sort((a,b)=>b.y-a.y)}
function bar(id,data,title,unit=''){Plotly.newPlot(id,[{x:data.map(d=>d.x),y:data.map(d=>d.y),type:'bar',hovertemplate:'%{x}<br>%{y:.2f} '+unit+'<extra></extra>'}],{margin:{t:5,r:10,b:55,l:55},paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{size:11,color:'#102033'},xaxis:{automargin:true},yaxis:{title:unit},showlegend:false},{responsive:true,displayModeBar:false})}
function pie(id,data){Plotly.newPlot(id,[{labels:data.map(d=>d.x),values:data.map(d=>d.y),type:'pie',hole:.52,textinfo:'label+percent',hovertemplate:'%{label}: %{value}<extra></extra>'}],{margin:{t:5,b:5,l:5,r:5},paper_bgcolor:'transparent',showlegend:true},{responsive:true,displayModeBar:false})}
function scatter(id){let d=filtered.filter(r=>Number.isFinite(num(r.Lead_times))&&Number.isFinite(num(r.Shipping_times)));Plotly.newPlot(id,[{x:d.map(r=>num(r.Lead_times)),y:d.map(r=>num(r.Shipping_times)),mode:'markers',type:'scatter',text:d.map(r=>`${r.SKU} • ${r.Supplier_name} • ${r.Location}`),customdata:d.map(r=>[r.Shipping_costs,r.Supplier_name,r.Location]),hovertemplate:'%{text}<br>Lead Time: %{x}<br>Shipping Time: %{y}<br>Shipping Cost: %{customdata[0]}<extra></extra>'}],{margin:{t:5,r:10,b:50,l:55},xaxis:{title:'Lead Time'},yaxis:{title:'Shipping Time'},paper_bgcolor:'transparent',plot_bgcolor:'transparent'},{responsive:true,displayModeBar:false})}
function render(){renderFilters();let c=$('#content');if(current==='Data Explorer')return renderExplorer(c);if(!filtered.length){c.innerHTML='<div class="panel empty">No data available for the selected filters.</div>';return}if(current==='Overview')renderOverview(c);if(current==='Delivery Analytics')renderDelivery(c);if(current==='Supplier Analytics')renderSupplier(c);if(current==='Transportation Analytics')renderTransport(c);if(current==='Inventory Analytics')renderInventory(c);if(current==='Quality Analytics')renderQuality(c)}
function renderOverview(c){let total=sum(filtered.map(r=>r.Revenue_generated)),sold=sum(filtered.map(r=>r.Number_of_products_sold));c.innerHTML=`<div class="kpis">${card('Average Delivery Time',fmt(avg(filtered.map(r=>r.Shipping_times)))+' Days','Average Shipping_times')}${card('Average Shipping Cost',money(avg(filtered.map(r=>r.Shipping_costs))),'Average Shipping_costs')}${card('Total Shipping / Freight Cost',money(sum(filtered.map(r=>r.Shipping_costs))),'Sum of Shipping_costs')}${card('Total Orders',filtered.length.toLocaleString(),'Valid dataset records')}${card('Average Order Quantity',fmt(avg(filtered.map(r=>r.Order_quantities)),0),'Average Order_quantities')}${card('Average Defect Rate',fmt(avg(filtered.map(r=>r.Defect_rates)),2),'Source-unit average; no unsupported conversion')}</div><div class="grid">${panel('Performance KPI Comparison','cmp',true)}${panel('Delivery Time by Carrier','ov1')}${panel('Shipping Cost by Transportation Mode','ov2')}${panel('Supplier Performance — Avg Delivery Time','ov3')}${panel('Regional Shipping Cost','ov4')}${panel('Revenue by Product Type','ov5')}${panel('Inspection Results','ov6')}</div><div class="panel"><div class="info">Dataset: ${filtered.length.toLocaleString()} rows × ${columns.length} columns · Revenue ${money(total)} · Products sold ${sold.toLocaleString()} · Updated ${new Date().toLocaleString()}</div></div>`;
bar('ov1',group('Shipping_carriers','Shipping_times'),'','Days');bar('ov2',group('Transportation_modes','Shipping_costs',sum),'','₹');bar('ov3',group('Supplier_name','Shipping_times'),'','Days');bar('ov4',group('Location','Shipping_costs',sum),'','₹');bar('ov5',group('Product_type','Revenue_generated',sum),'','₹');pie('ov6',Object.entries(filtered.reduce((m,r)=>(m[r.Inspection_results]=(m[r.Inspection_results]||0)+1,m),{})).map(([x,y])=>({x,y})));
let dims=['Supplier_name','Location','Shipping_carriers','Transportation_modes'];let d=group(dims[0],'Shipping_times');Plotly.newPlot('cmp',[{x:d.map(o=>o.x),y:d.map(o=>o.y),type:'bar'}],{margin:{t:5,b:60,l:55,r:10},yaxis:{title:'Avg Delivery Time (days)'},paper_bgcolor:'transparent',plot_bgcolor:'transparent'},{responsive:true,displayModeBar:false});}
function renderDelivery(c){c.innerHTML=`<div class="grid">${panel('Average Delivery Time by Carrier','d1')}${panel('Average Delivery Time by Location','d2')}${panel('Lead Time vs Shipping Time','d3',true)}${panel('Delivery Time Distribution','d4',true)}</div>`;bar('d1',group('Shipping_carriers','Shipping_times'),'','Days');bar('d2',group('Location','Shipping_times'),'','Days');scatter('d3');let a=filtered.map(r=>num(r.Shipping_times)).filter(Number.isFinite);Plotly.newPlot('d4',[{x:a,type:'histogram',hovertemplate:'Shipping Time: %{x}<br>Count: %{y}<extra></extra>'}],{margin:{t:5,b:45,l:50,r:10},xaxis:{title:'Shipping Time (days)'},yaxis:{title:'Records'},paper_bgcolor:'transparent',plot_bgcolor:'transparent'},{responsive:true,displayModeBar:false})}
function renderSupplier(c){let g={};filtered.forEach(r=>{let k=r.Supplier_name;if(!k)return;(g[k]??=[]).push(r)});let rows=Object.entries(g).map(([k,a])=>({Supplier:k,Orders:a.length,AvgDelivery:avg(a.map(r=>r.Shipping_times)),AvgCost:avg(a.map(r=>r.Shipping_costs)),AvgOrderQty:avg(a.map(r=>r.Order_quantities)),AvgDefect:avg(a.map(r=>r.Defect_rates)),TotalCost:sum(a.map(r=>r.Shipping_costs))}));c.innerHTML=`<div class="grid">${panel('Supplier Cost Comparison','s1')}${panel('Supplier Delivery Comparison','s2')}${panel('Supplier Quality Comparison','s3')}${panel('Supplier Order Quantity','s4')}</div><div class="panel"><h3>Supplier Performance Ranking</h3>${table(rows,['Supplier','Orders','AvgDelivery','AvgCost','AvgOrderQty','AvgDefect','TotalCost'])}</div>`;bar('s1',rows.map(r=>({x:r.Supplier,y:r.TotalCost})).sort((a,b)=>b.y-a.y),'','₹');bar('s2',rows.map(r=>({x:r.Supplier,y:r.AvgDelivery})).sort((a,b)=>b.y-a.y),'','Days');bar('s3',rows.map(r=>({x:r.Supplier,y:r.AvgDefect})).sort((a,b)=>b.y-a.y),'','Source unit');bar('s4',rows.map(r=>({x:r.Supplier,y:r.AvgOrderQty})).sort((a,b)=>b.y-a.y),'','Units')}
function renderTransport(c){let g={};filtered.forEach(r=>{let k=r.Transportation_modes;if(!k)return;(g[k]??=[]).push(r)});let rows=Object.entries(g).map(([k,a])=>({Mode:k,Orders:a.length,AvgTime:avg(a.map(r=>r.Shipping_times)),AvgCost:avg(a.map(r=>r.Shipping_costs)),TotalCost:sum(a.map(r=>r.Shipping_costs)),OrderQty:avg(a.map(r=>r.Order_quantities)),CostPerQty:(sum(a.map(r=>r.Shipping_costs))/sum(a.map(r=>r.Order_quantities).filter(Number.isFinite)))}));c.innerHTML=`<div class="grid">${panel('Shipping Cost by Transportation Mode','t1')}${panel('Delivery Time by Transportation Mode','t2')}${panel('Average Order Quantity by Mode','t3')}${panel('Cost Efficiency — Shipping Cost / Order Quantity','t4')}</div><div class="panel"><h3>Transportation Mode Summary</h3>${table(rows,['Mode','Orders','AvgTime','AvgCost','TotalCost','OrderQty','CostPerQty'])}</div>`;bar('t1',rows.map(r=>({x:r.Mode,y:r.TotalCost})),'','₹');bar('t2',rows.map(r=>({x:r.Mode,y:r.AvgTime})),'','Days');bar('t3',rows.map(r=>({x:r.Mode,y:r.OrderQty})),'','Units');bar('t4',rows.map(r=>({x:r.Mode,y:r.CostPerQty})),'','₹ / order qty')}
function renderInventory(c){let g={};filtered.forEach(r=>{let k=r.Product_type;if(!k)return;(g[k]??=[]).push(r)});c.innerHTML=`<div class="grid">${panel('Inventory by Product Type','i1')}${panel('Stock vs Products Sold','i2')}${panel('Revenue by Product Type','i3')}${panel('Top Products','i4')}</div>`;bar('i1',Object.entries(g).map(([x,a])=>({x,y:avg(a.map(r=>r.Stock_levels))})),'','Stock');let d=filtered.filter(r=>Number.isFinite(num(r.Stock_levels))&&Number.isFinite(num(r.Number_of_products_sold)));Plotly.newPlot('i2',[{x:d.map(r=>num(r.Stock_levels)),y:d.map(r=>num(r.Number_of_products_sold)),mode:'markers',type:'scatter',text:d.map(r=>`${r.SKU} • ${r.Product_type}`),hovertemplate:'%{text}<br>Stock: %{x}<br>Sold: %{y}<extra></extra>'}],{margin:{t:5,b:50,l:55,r:10},xaxis:{title:'Stock Level'},yaxis:{title:'Products Sold'},paper_bgcolor:'transparent',plot_bgcolor:'transparent'},{responsive:true,displayModeBar:false});bar('i3',group('Product_type','Revenue_generated',sum),'','₹');$('#i4').outerHTML='<div class="panel wide"><h3>Top Products</h3>'+table(filtered.map(r=>({SKU:r.SKU,ProductType:r.Product_type,Price:r.Price,StockLevel:r.Stock_levels,ProductsSold:r.Number_of_products_sold,Revenue:r.Revenue_generated})).sort((a,b)=>num(b.Revenue)-num(a.Revenue)).slice(0,25),['SKU','ProductType','Price','StockLevel','ProductsSold','Revenue'])+'</div>'}
function renderQuality(c){c.innerHTML=`<div class="grid">${panel('Inspection Result Distribution','q1')}${panel('Defect Rate by Supplier','q2')}${panel('Defect Rate by Product Type','q3')}${panel('Defect Rate by Location','q4')}</div><div class="panel"><h3>Quality Summary</h3>${table(filtered.map(r=>({SKU:r.SKU,Supplier:r.Supplier_name,ProductType:r.Product_type,Location:r.Location,Inspection:r.Inspection_results,DefectRate:r.Defect_rates})).slice(0,100),['SKU','Supplier','ProductType','Location','Inspection','DefectRate'])}</div>`;pie('q1',Object.entries(filtered.reduce((m,r)=>(m[r.Inspection_results]=(m[r.Inspection_results]||0)+1,m),{})).map(([x,y])=>({x,y})));bar('q2',group('Supplier_name','Defect_rates'),'','Source unit');bar('q3',group('Product_type','Defect_rates'),'','Source unit');bar('q4',group('Location','Defect_rates'),'','Source unit')}
function table(rows,keys){return `<div class="table-wrap"><table class="data-table"><thead><tr>${keys.map(k=>`<th onclick="sortTable(this,'${k}')">${k} ↕</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(Number.isFinite(num(r[k]))?(Math.abs(num(r[k]))>10000?num(r[k]).toLocaleString():fmt(num(r[k]),2)):r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function sortTable(th,key){let t=th.closest('table'),rows=[...t.tBodies[0].rows];let asc=sortState[key]=!sortState[key];rows.sort((a,b)=>{let x=a.cells[[...t.tHead.rows[0].cells].indexOf(th)].textContent,y=b.cells[[...t.tHead.rows[0].cells].indexOf(th)].textContent;let nx=num(x),ny=num(y);return Number.isFinite(nx)&&Number.isFinite(ny)?(nx-ny)*(asc?1:-1):x.localeCompare(y)*(asc?1:-1)});rows.forEach(r=>t.tBodies[0].appendChild(r))}
function renderExplorer(c){let search=`<div class="panel"><h3>Data Explorer</h3><input id="globalSearch" placeholder="Search SKU, supplier, location, product type, route, carrier..." style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"><div class="info" style="margin-top:8px">${filtered.length.toLocaleString()} filtered rows · ${columns.length} columns · Click headers to sort</div><div id="exploreTable" style="margin-top:10px"></div></div>`;c.innerHTML=search;let paint=()=>{let q=$('#globalSearch').value.toLowerCase();let d=filtered.filter(r=>!q||Object.values(r).some(v=>String(v).toLowerCase().includes(q))).slice(0,500);$('#exploreTable').innerHTML=table(d,columns)};$('#globalSearch').oninput=paint;paint()}
function exportCSV(){let rows=filtered;let csv=[columns.join(','),...rows.map(r=>columns.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='filtered_supply_chain_data.csv';a.click();URL.revokeObjectURL(a.href)}
function normalizeRow(r){let o={};for(let k of columns)o[k]=r[k];return o}
function loadWorkbook(buf){try{let wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];let arr=XLSX.utils.sheet_to_json(ws,{defval:''});if(!arr.length)throw Error();columns=Object.keys(arr[0]);raw=arr.map(normalizeRow);filtered=[...raw];render();toast(`Loaded ${raw.length.toLocaleString()} rows`)}catch(e){toast('Unable to read this file. Please upload a valid CSV or Excel file.')}}
$('#file').onchange=e=>{let f=e.target.files[0];if(f){let rd=new FileReader();rd.onload=ev=>loadWorkbook(ev.target.result);rd.readAsArrayBuffer(f)}};
function loadDefault(){try{const bin=atob(EMBEDDED_XLSX_BASE64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);loadWorkbook(bytes.buffer)}catch(e){console.error(e);toast('Unable to load the bundled dataset. Please use Upload Dataset.')}}
setupNav();loadDefault();
</script></body></html>
